services:
  kwikkwiz:
    build:
      context: ./kwikkwiz
      dockerfile: Dockerfile
    container_name: kwikkwiz
    image: site/kwikkwiz
    expose:
      - "3000"
    networks:
      - kwikkwiz
    restart: unless-stopped

  db-kwikkwiz:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kwikkwiz
      POSTGRES_USER: kwikkwiz
      POSTGRES_PASSWORD: kwikkwiz
    expose:
      - "5432"
    volumes:
      - kwikkwiz-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kwikkwiz

volumes:
  kwikkwiz-db-data:
